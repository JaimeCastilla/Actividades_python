<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar servidor Minecraft</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #f8f8f8; }
    .page { max-width: 640px; margin: 3rem auto; padding: 2rem; background: #1f1f1f; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    h1 { margin-top: 0; color: #e2a400; }
    button { padding: 1rem 1.5rem; font-size: 1rem; border: none; border-radius: 999px; background: #32a852; color: white; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    .status { margin-top: 1.5rem; padding: 1rem; background: #272727; border-radius: 10px; }
    .note { margin-top: 1rem; color: #bbb; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Servidor Minecraft 1.20.1</h1>
    <p>Haz clic en iniciar para levantar el servidor en segundo plano.</p>
    <button id="startButton">Iniciar servidor</button>
    <div class="status" id="status">
      <strong>Estado:</strong> cargando...
    </div>
    <div class="note">
      Si el servidor ya está en ejecución, el botón mostrará que ya está iniciado.
    </div>
  </div>
  <script>
    const startButton = document.getElementById('startButton');
    const statusBox = document.getElementById('status');

    async function updateStatus() {
      try {
        const res = await fetch('/status');
        const data = await res.json();
        statusBox.innerHTML = `<strong>Estado:</strong> ${data.message}`;
        startButton.disabled = data.running;
        startButton.textContent = data.running ? 'Servidor en ejecución' : 'Iniciar servidor';
      } catch (err) {
        statusBox.innerHTML = `<strong>Estado:</strong> error al consultar el servidor`;
        console.error(err);
      }
    }

    async function startServer() {
      startButton.disabled = true;
      startButton.textContent = 'Iniciando...';
      try {
        const res = await fetch('/start', { method: 'POST' });
        const data = await res.json();
        statusBox.innerHTML = `<strong>Estado:</strong> ${data.message}`;
        startButton.disabled = data.running;
        startButton.textContent = data.running ? 'Servidor en ejecución' : 'Iniciar servidor';
      } catch (err) {
        statusBox.innerHTML = `<strong>Estado:</strong> error al iniciar servidor`;
        startButton.disabled = false;
        startButton.textContent = 'Iniciar servidor';
        console.error(err);
      }
    }

    startButton.addEventListener('click', () => startServer());
    updateStatus();
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
