<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Servidor Minecraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 60px 40px;
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #333;
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .subtitle {
      color: #666;
      font-size: 1rem;
      margin-bottom: 40px;
    }
    .button-wrapper {
      margin: 40px 0;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 20px 60px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
    }
    button:active:not(:disabled) {
      transform: translateY(-1px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status-box {
      background: #f5f5f5;
      border-left: 5px solid #667eea;
      border-radius: 8px;
      padding: 20px;
      margin-top: 30px;
      text-align: left;
    }
    .status-label {
      font-size: 0.9rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .status-message {
      font-size: 1.1rem;
      color: #333;
      font-weight: 500;
    }
    .status-message.success { color: #27ae60; }
    .status-message.error { color: #e74c3c; }
    .status-message.loading { color: #667eea; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .note {
      color: #999;
      font-size: 0.85rem;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Minecraft</h1>
    <p class="subtitle">Servidor 1.20.1 - Día de 3 horas</p>
    
    <div class="button-wrapper">
      <button id="startButton">Iniciar Servidor</button>
    </div>

    <div class="status-box">
      <div class="status-label">Estado</div>
      <div class="status-message" id="statusMessage">Cargando...</div>
    </div>

    <p class="note">
      ℹ️ El servidor se iniciará en segundo plano. Puedes cerrar esta página sin problemas.
    </p>
  </div>

  <script>
    const startButton = document.getElementById('startButton');
    const statusMessage = document.getElementById('statusMessage');

    function setStatus(message, type = 'info') {
      statusMessage.textContent = message;
      statusMessage.className = 'status-message ' + type;
    }

    function setStatusLoading(message) {
      statusMessage.innerHTML = '<span class="spinner"></span>' + message;
      statusMessage.className = 'status-message loading';
    }

    async function checkStatus() {
      try {
        const res = await fetch('/status');
        const data = await res.json();
        if (data.running) {
          setStatus('✓ Servidor en ejecución', 'success');
          startButton.disabled = true;
          startButton.textContent = 'Servidor activo';
        } else {
          setStatus('⊙ Servidor detenido', 'info');
          startButton.disabled = false;
          startButton.textContent = 'Iniciar Servidor';
        }
      } catch (err) {
        setStatus('✕ Error al consultar estado', 'error');
        startButton.disabled = false;
      }
    }

    async function startServer() {
      startButton.disabled = true;
      setStatusLoading('Inicializando...');

      try {
        const res = await fetch('/start', { method: 'POST' });
        const data = await res.json();

        if (data.running) {
          setStatus('✓ ' + data.message, 'success');
          startButton.textContent = 'Servidor activo';
        } else {
          setStatus('✕ ' + data.message, 'error');
          startButton.disabled = false;
          startButton.textContent = 'Iniciar Servidor';
        }
      } catch (err) {
        setStatus('✕ Error: ' + err.message, 'error');
        startButton.disabled = false;
        startButton.textContent = 'Iniciar Servidor';
      }
    }

    startButton.addEventListener('click', () => startServer());
    checkStatus();
    setInterval(checkStatus, 5000);
  </script>
</body>
</html>
